<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>資料備份與還原 · Arhorngor</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#173247;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:520px;margin:auto;padding:24px 18px 50px;background:white;min-height:100vh}h1{color:#073665;font-size:27px}h2{font-size:19px;margin-top:28px}p{line-height:1.6}button,.button{display:block;width:100%;margin:12px 0;padding:14px;border:0;border-radius:10px;background:#073665;color:white;font:inherit;text-align:center}button:disabled{opacity:.45}a{color:#176ea8}.notice{background:#edf3f7;border-radius:10px;padding:14px;font-size:14px}input{max-width:100%;margin:10px 0}pre{white-space:pre-wrap;word-break:break-word;font:inherit}#message{color:#a23d28}label{display:block;line-height:1.6}</style></head><body><main><a href="./">⌂ 首頁</a> · <a href="history.html?v=20">歷史與暫存球局</a><h1>資料備份／還原</h1><p>資料保存在這個瀏覽器。請把備份檔另外留在手機檔案或雲端硬碟；清除網站資料會一併刪除瀏覽器內的備份。</p><h2>完整備份</h2><p>保留進行中、歷史、暫存球局、原始資料及球袋／球僮設定。下載完成後，請確認檔案確實存在。</p><button id="export">下載完整 JSON 備份</button><h2>匯入球局</h2><p>先預覽，再確認新增。同內容跳過；同ID但內容不同，另存衝突副本。正在打的球局不會被取代。</p><input id="file" type="file" accept=".json,application/json"><pre class="notice" id="preview">請選擇 Arhorngor JSON 備份檔。</pre><button id="import" disabled>確認新增球局</button><h2>回退上一個保存版本</h2><p>先下載目前完整備份。回退會另存目前原文，再切換到上一個成功保存的版本；原始舊資料仍保留。</p><button id="rollback">備份並回退上一版本</button><p id="message" role="status"></p></main><script src="round-core.js?v=20"></script><script src="round-store.js?v=20"></script><script src="data-v2.js?v=20"></script></body></html>
