<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>球局總覽 · Arhorngor</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f6;color:#173247;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}.page{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 22px)}h1{font-size:26px;color:#073665;margin:3px 0}.ey{font-size:9px;letter-spacing:1.3px;color:#7890a2;font-weight:850}.head{display:flex;justify-content:space-between;align-items:start}.back{border:0;border-radius:8px;background:#eaf1f5;color:#31556d;padding:9px 11px;font-weight:850}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.card{background:#f3f7f9;border-radius:10px;padding:11px;text-align:center}.card b{display:block;color:#073665;font-size:22px}.card span{font-size:9px;color:#758997}.section{font-size:12px;font-weight:900;color:#073665;margin:16px 0 7px}.table{overflow-x:auto;border:1px solid #e3eaee;border-radius:10px}.grid{display:grid;grid-template-columns:44px 44px 44px minmax(170px,1fr);min-width:302px}.cell{padding:8px 6px;border-bottom:1px solid #edf1f3;font-size:11px}.th{font-weight:900;background:#f4f7f9;color:#476477}.clubs{white-space:normal;overflow-wrap:anywhere;line-height:1.65}.putt-line{display:block;color:#176ea8;font-weight:750}.halfrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px 6px;background:#f4f7f9;border-bottom:1px solid #dce6ec;text-align:center}.halfrow b{display:block;color:#073665;font-size:15px}.halfrow span{color:#758997;font-size:10px}.finish{width:100%;height:52px;border:0;border-radius:10px;background:#073665;color:#fff;font-size:15px;font-weight:900;margin-top:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.action{height:48px;border:0;border-radius:10px;font-weight:900}.analysis{background:#176ea8;color:#fff}.roundbtn{background:#eaf1f5;color:#31556d}.empty{padding:35px;text-align:center;color:#8496a2}</style></head><body><main class="page" id="app"></main><script src="analytics.js?v=1"></script><script>const r=JSON.parse(localStorage.getItem('arhorngor-active-round')||'null');const app=document.getElementById('app');if(!r){app.innerHTML='<div class="empty">目前沒有進行中的球局</div>'}else{const hs=r.holes||{};let total=0,putts=0,played=0,pars=0,shortShots=0,penalties=0,gir=0,girEligible=0,rows='';const half=[{score:0,par:0,played:0},{score:0,par:0,played:0}];const order=(()=>{if(Array.isArray(r.playOrder)&&r.playOrder.length===18)return r.playOrder;if(r.courseHoles>18){const n=Math.ceil(r.courseHoles/9),si=Math.floor((r.startHole-1)/9),secs=r.playSections||[si,(si+1)%n],a=[];secs.slice(0,2).forEach(s=>{for(let i=1;i<=9;i++)a.push(s*9+i)});return a}const a=[];for(let i=0;i<r.courseHoles;i++)a.push(((r.startHole-1+i)%r.courseHoles)+1);return a})();if(!Array.isArray(r.playOrder)&&r.courseHoles>18){const extras=Object.keys(hs).map(Number).filter(n=>!order.includes(n)&&(hs[n]?.shots||[]).length);for(const n of extras){const empty=order.findIndex(k=>!(hs[k]?.shots||[]).length);if(empty<0)break;order[empty]=n}}const penaltyStrokes=x=>x?.penalty==='OB 前方補球'?2:((x?.penalty||x?.club==='罰')?1:0),strokeCount=s=>s.reduce((n,x)=>n+(penaltyStrokes(x)||1),0);const holeLabel=n=>{if(r.courseHoles>18&&Array.isArray(r.sections)){const si=Math.floor((n-1)/9),hn=(n-1)%9+1,s=(r.sections[si]||'').replace('區','');return s+hn}return String(n)};for(const [oi,n] of order.entries()){const h=hs[n],s=h?.shots||[],p=h?.par??r.pars?.[n-1]??null;if(s.length){played++;total+=strokeCount(s);putts+=s.filter(x=>x.club==='PT').length;shortShots+=s.filter(x=>['50°','56°','58°','60°'].includes(x.club)).length;penalties+=s.reduce((a,x)=>a+penaltyStrokes(x),0);if(p){pars+=p;const firstPT=s.findIndex(x=>x.club==='PT');if(firstPT>=0){girEligible++;if(strokeCount(s.slice(0,firstPT))<=p-2)gir++}}const hi=oi<9?0:1;half[hi].score+=strokeCount(s);half[hi].played++;if(p)half[hi].par+=p}rows+=`<div class="cell">${holeLabel(n)}</div><div class="cell">${p??'—'}</div><div class="cell">${s.length?strokeCount(s):'—'}</div><div class="cell clubs">${s.map(x=>x.club==='PT'?'<span class="putt-line">PT '+(x.putt==='<3m'?'<3y':x.putt==='3–7m'?'3–7y':x.putt==='7m+'?'7y+':x.putt||'')+'</span>':x.penalty?'罰'+penaltyStrokes(x)+' · '+x.penalty+' · ':x.club+' · ').join('')||'—'}</div>`}const halfText=h=>{if(!h.played)return'—';if(h.played<9)return h.score+'（'+h.played+'/9）';const d=h.par?h.score-h.par:null,rr=d===null?'':d===0?' E':d>0?' +'+d:' '+d;return h.score+rr};const diff=pars?total-pars:null;const rel=diff===null?'—':diff===0?'E':diff>0?'+'+diff:String(diff);app.innerHTML=`<div class="head"><div><div class="ey">ROUND OVERVIEW</div><h1>${r.course}</h1></div><button class="back" onclick="location.href='./'">首頁</button></div><div class="cards"><div class="card"><b>${total}</b><span>總桿</span></div><div class="card"><b>${rel}</b><span>相對 Par</span></div><div class="card"><b>${putts}</b><span>推桿</span></div></div><div class="cards"><div class="card"><b>${shortShots}</b><span>短桿</span></div><div class="card"><b>${penalties}</b><span>罰桿</span></div><div class="card"><b>${girEligible?Math.round(gir/girEligible*100)+'%':'—'}</b><span>上果嶺率*</span></div></div><div class="section">逐洞總覽</div><div class="table"><div class="halfrow"><div><b>${halfText(half[0])}</b><span>前九</span></div><div><b>${halfText(half[1])}</b><span>後九</span></div><div><b>${half[0].played===9&&half[1].played===9?Math.abs(half[0].score-half[1].score):'—'}</b><span>前後九差</span></div></div><div class="grid"><div class="cell th">洞</div><div class="cell th">Par</div><div class="cell th">桿</div><div class="cell th">用桿順序</div>${rows}</div></div><div style="font-size:10px;color:#758997;margin-top:6px">*上果嶺率依首次推桿前的桿數推估 GIR，非實測球位；短桿為50°／56°／58°／60°使用次數。</div><div class="actions"><button class="action roundbtn" onclick="location.href='round.html?v=9'">回記桿</button><button class="action analysis" onclick="location.href='analysis.html?v=2'">查看分析</button></div><button class="finish" id="finishRound">完成本局</button>`;document.getElementById('finishRound').onclick=()=>{const HISTORY='arhorngor-history';const list=JSON.parse(localStorage.getItem(HISTORY)||'[]');const saved={...r,status:'finished',finishedAt:new Date().toISOString(),totalScore:total,totalPutts:putts};const i=list.findIndex(x=>String(x.id)===String(saved.id));if(i>=0)list[i]=saved;else list.unshift(saved);localStorage.setItem(HISTORY,JSON.stringify(list));window.ArhorngorAnalytics?.track('round_finished');localStorage.setItem('arhorngor-view-round',JSON.stringify(saved));localStorage.removeItem('arhorngor-active-round');location.href='history.html?v=1'}}</script></body></html>
