<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>球局總覽 · Arhorngor</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f6;color:#173247;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}.page{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 22px)}h1{font-size:26px;color:#073665;margin:3px 0}.ey{font-size:9px;letter-spacing:1.3px;color:#7890a2;font-weight:850}.head{display:flex;justify-content:space-between;align-items:start}.back{border:0;border-radius:8px;background:#eaf1f5;color:#31556d;padding:9px 11px;font-weight:850}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.card{background:#f3f7f9;border-radius:10px;padding:11px;text-align:center}.card b{display:block;color:#073665;font-size:22px}.card span{font-size:9px;color:#758997}.section{font-size:12px;font-weight:900;color:#073665;margin:16px 0 7px}.table{overflow-x:auto;border:1px solid #e3eaee;border-radius:10px}.grid{display:grid;grid-template-columns:44px 44px 44px minmax(170px,1fr);min-width:302px}.cell{padding:8px 6px;border-bottom:1px solid #edf1f3;font-size:11px}.th{font-weight:900;background:#f4f7f9;color:#476477}.clubs{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.finish{width:100%;height:52px;border:0;border-radius:10px;background:#073665;color:#fff;font-size:15px;font-weight:900;margin-top:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.action{height:48px;border:0;border-radius:10px;font-weight:900}.analysis{background:#176ea8;color:#fff}.roundbtn{background:#eaf1f5;color:#31556d}.empty{padding:35px;text-align:center;color:#8496a2}</style></head><body><main class="page" id="app"></main><script>const r=JSON.parse(localStorage.getItem('arhorngor-active-round')||'null');const app=document.getElementById('app');if(!r){app.innerHTML='<div class="empty">目前沒有進行中的球局</div>'}else{const hs=r.holes||{};let total=0,putts=0,played=0,pars=0,rows='';const order=(()=>{if(r.courseHoles>18){const n=Math.ceil(r.courseHoles/9),si=Math.floor((r.startHole-1)/9),secs=r.playSections||[si,(si+1)%n],a=[];secs.slice(0,2).forEach(s=>{for(let i=1;i<=9;i++)a.push(s*9+i)});return a}const a=[];for(let i=0;i<r.courseHoles;i++)a.push(((r.startHole-1+i)%r.courseHoles)+1);return a})();const holeLabel=n=>{if(r.courseHoles>18&&Array.isArray(r.sections)){const si=Math.floor((n-1)/9),hn=(n-1)%9+1,s=(r.sections[si]||'').replace('區','');return s+hn}return String(n)};for(const n of order){const h=hs[n],s=h?.shots||[],p=h?.par??r.pars?.[n-1]??null;if(s.length){played++;total+=s.length;putts+=s.filter(x=>x.club==='PT').length;if(p)pars+=p}rows+=`<div class="cell">${holeLabel(n)}</div><div class="cell">${p??'—'}</div><div class="cell">${s.length||'—'}</div><div class="cell clubs">${s.map(x=>x.club+(x.putt?' '+x.putt:'')).join(' · ')||'—'}</div>`}const diff=pars?total-pars:null;const rel=diff===null?'—':diff===0?'E':diff>0?'+'+diff:String(diff);app.innerHTML=`<div class="head"><div><div class="ey">ROUND OVERVIEW</div><h1>${r.course}</h1></div><button class="back" onclick="location.href='./'">首頁</button></div><div class="cards"><div class="card"><b>${total}</b><span>總桿</span></div><div class="card"><b>${rel}</b><span>相對 Par</span></div><div class="card"><b>${putts}</b><span>推桿</span></div></div><div class="section">逐洞總覽</div><div class="table"><div class="grid"><div class="cell th">洞</div><div class="cell th">Par</div><div class="cell th">桿</div><div class="cell th">用桿順序</div>${rows}</div></div><div class="actions"><button class="action roundbtn" onclick="location.href='round.html?v=9'">回記桿</button><button class="action analysis" onclick="location.href='analysis.html?v=2'">查看分析</button></div><button class="finish" id="finishRound">完成本局</button>`;document.getElementById('finishRound').onclick=()=>{const HISTORY='arhorngor-history';const list=JSON.parse(localStorage.getItem(HISTORY)||'[]');const saved={...r,status:'finished',finishedAt:new Date().toISOString(),totalScore:total,totalPutts:putts};const i=list.findIndex(x=>String(x.id)===String(saved.id));if(i>=0)list[i]=saved;else list.unshift(saved);localStorage.setItem(HISTORY,JSON.stringify(list));localStorage.setItem('arhorngor-view-round',JSON.stringify(saved));localStorage.removeItem('arhorngor-active-round');location.href='history.html?v=1'}}</script></body></html>
