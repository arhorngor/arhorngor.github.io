<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>Arhorngor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}button{font:inherit}.home{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;color:#fff;background:#178bd2 url('hero.jpg?v=3') center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,43,80,.18),rgba(3,43,80,.02) 44%,rgba(2,27,51,.18) 67%,rgba(2,24,46,.62))}.content{position:relative;z-index:2;height:100%;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 17px);display:flex;flex-direction:column}.brand{text-align:center;margin-top:2vh;text-shadow:0 2px 14px #06325e77}.logo{font:600 43px Georgia,"Times New Roman",serif}.tag{font-size:9px;letter-spacing:2.6px;font-weight:800;margin-top:8px}.life{font-size:9px;letter-spacing:3px;font-weight:850;margin-top:5vh}.message{font-size:13px;letter-spacing:.5px;margin-top:12px}.space{flex:1;min-height:24vh}.actions{width:88%;margin:0 auto 2.5vh;display:grid;gap:8px}.btn{border-radius:12px;font-weight:900;box-shadow:0 7px 20px #001b3330}.start{height:59px;border:1px solid #ffffff66;background:#073665ee;color:#fff;font-size:17px}.continue{display:none;height:52px;border:1px solid #fff;background:#eef7fdf2;color:#073665;font-size:14px}.continue.show{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{height:54px;border:1px solid #ffffffdd;background:#fffffff0;color:#073665;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:flex-end;font-size:9px;color:#ffffffd8;text-shadow:0 1px 5px #001b33}.privacy{font-size:8px;opacity:.8}@media(max-height:700px){.brand{margin-top:0}.life{margin-top:2vh}.space{min-height:12vh}.actions{margin-bottom:1vh}}</style></head><body><main class="home"><div class="shade"></div><div class="content"><section class="brand"><div class="logo">Arhorngor</div><div class="tag">PLAY · TRACK · IMPROVE</div><div class="life">A BETTER GOLF LIFE</div><div class="message">記錄每一場球，看見真正的進步</div></section><div class="space"></div><section class="actions"><button class="btn start" id="start">＋ 開始新球局</button><button class="btn continue" id="continue">▶ 繼續目前球局</button><div class="row"><button class="btn secondary" id="history">歷史球局</button><button class="btn secondary" id="bag">球僮與球袋</button></div></section><footer class="footer"><span>Created by Hwadefa</span><span class="privacy">LOCAL FIRST · NO ACCOUNT</span></footer></div></main><script>const active=localStorage.getItem('arhorngor-active-round');if(active)document.getElementById('continue').classList.add('show');document.getElementById('start').onclick=()=>location.href='new-round.html?v=3';document.getElementById('continue').onclick=()=>location.href='new-round.html?continue=1&v=3';document.getElementById('history').onclick=()=>location.href='history.html?v=1';document.getElementById('bag').onclick=()=>location.href='bag.html?v=3';</script></body></html>
