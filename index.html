<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#082f5b"><title>Arhorngor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}body{background:#082f5b}.home{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;color:#fff;background-image:linear-gradient(180deg,rgba(5,43,82,.28),rgba(5,43,82,.06) 38%,rgba(4,28,53,.66)),url('https://res.cloudinary.com/luxuryp/images/w_1280,c_limit,f_auto,q_auto/effy38z1gg9gbrunpxuf/pebblebeach_golf_388266324');background-size:cover;background-position:58% center;padding:calc(env(safe-area-inset-top) + 24px) 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column}.brandbox{text-align:center;margin-top:4vh}.brand{font:600 48px Georgia,"Times New Roman",serif;line-height:1;color:#fff;text-shadow:0 2px 16px #082f5b44}.tag{font-size:9px;letter-spacing:2.8px;font-weight:700;margin-top:10px;opacity:.92}.message{text-align:center;margin-top:4vh;font-size:13px;letter-spacing:.6px;text-shadow:0 1px 7px #082f5b66}.spacer{flex:1}.actions{display:grid;gap:9px;margin-bottom:4vh}.start{height:62px;border:1px solid #ffffff55;border-radius:12px;background:#082f5beF;color:#fff;font-size:18px;font-weight:900;box-shadow:0 7px 20px #001b3338}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.secondary{height:57px;border:1px solid #ffffffcc;border-radius:11px;background:#fffffff0;color:#082f5b;font-size:15px;font-weight:900}.continue{display:none;height:54px;border:1px solid #ffffff99;border-radius:11px;background:#eaf4fcf2;color:#082f5b;font-size:14px;font-weight:850}.continue.show{display:block}.footer{display:flex;justify-content:space-between;align-items:end;font-size:9px;color:#ffffffc9;letter-spacing:.4px}.privacy{font-size:8px;letter-spacing:.2px;opacity:.72}</style></head><body><main class="home"><section class="brandbox"><div class="brand">Arhorngor</div><div class="tag">PLAY · TRACK · IMPROVE</div><div class="message">記錄每一場球，看見真正的進步</div></section><div class="spacer"></div><section class="actions"><button class="start" id="start">＋ 開始新球局</button><button class="continue" id="continue">▶ 繼續目前球局</button><div class="row"><button class="secondary" id="history">歷史球局</button><button class="secondary" id="bag">我的球袋</button></div></section><footer class="footer"><span>Created by Hwadefa</span><span class="privacy">LOCAL FIRST · NO ACCOUNT</span></footer></main><script>document.getElementById('start').onclick=()=>alert('下一步接入：搜尋球場 → 選起始區 → 開始球局');document.getElementById('history').onclick=()=>alert('下一步接入歷史球局');document.getElementById('bag').onclick=()=>alert('下一步接入我的球袋');document.getElementById('continue').onclick=()=>alert('下一步接入目前球局');</script></body></html>
