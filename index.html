<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>Arhorngor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}body{background:#073665}.home{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;color:#fff;background:#178bd2}.sky{position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(2,51,102,.03) 0%,rgba(2,51,102,.02) 45%,rgba(3,31,58,.48) 100%),url('https://www.pebblebeach.com/content/uploads/09aPBGL21-1mm0635Hc-900x600.jpg');background-size:cover;background-position:52% center;transform:scale(1.015)}.sky:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,52,99,.05),transparent 46%,rgba(3,27,51,.24) 72%,rgba(3,24,45,.65))}.content{position:relative;z-index:2;height:100%;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column}.brandbox{text-align:center;margin-top:2.5vh;text-shadow:0 2px 16px #07366577}.brand{font:600 43px Georgia,"Times New Roman",serif;line-height:1}.tag{font-size:9px;letter-spacing:2.7px;font-weight:750;margin-top:9px}.life{font-size:9px;letter-spacing:3.2px;font-weight:800;margin-top:7vh}.message{font-size:13px;letter-spacing:.7px;margin-top:14px}.viewspace{flex:1;min-height:23vh}.actions{display:grid;gap:8px;width:88%;margin:0 auto 3.2vh}.start,.continue,.secondary{border-radius:12px;font-weight:900;box-shadow:0 6px 18px #001a3130}.start{height:59px;border:1px solid #ffffff55;background:#073665ee;color:#fff;font-size:17px}.continue{display:none;height:53px;border:1px solid #fff;background:#eaf4fcf2;color:#073665;font-size:14px}.continue.show{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{height:55px;border:1px solid #ffffffdd;background:#fffffff0;color:#073665;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:end;font-size:9px;color:#fff;letter-spacing:.5px;text-shadow:0 1px 5px #001a31}.privacy{font-size:8px;opacity:.78}@media(max-height:700px){.life{margin-top:3vh}.viewspace{min-height:13vh}.actions{margin-bottom:1.5vh}.brand{font-size:38px}}</style></head><body><main class="home"><div class="sky"></div><div class="content"><section class="brandbox"><div class="brand">Arhorngor</div><div class="tag">PLAY · TRACK · IMPROVE</div><div class="life">A BETTER GOLF LIFE</div><div class="message">記錄每一場球，看見真正的進步</div></section><div class="viewspace"></div><section class="actions"><button class="start" id="start">＋ 開始新球局</button><button class="continue" id="continue">▶ 繼續目前球局</button><div class="row"><button class="secondary" id="history">歷史球局</button><button class="secondary" id="bag">我的球袋</button></div></section><footer class="footer"><span>Created by Hwadefa</span><span class="privacy">LOCAL FIRST · NO ACCOUNT</span></footer></div></main><script>document.getElementById('start').onclick=()=>alert('下一步接入：搜尋球場 → 選起始區 → 開始球局');document.getElementById('history').onclick=()=>alert('下一步接入歷史球局');document.getElementById('bag').onclick=()=>alert('下一步接入我的球袋');document.getElementById('continue').onclick=()=>alert('下一步接入目前球局');</script></body></html>
