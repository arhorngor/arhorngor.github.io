<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>Arhorngor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}body{background:#073665}.home{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;color:#fff;background:#178bd2}.hero{position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(4,45,88,.04),rgba(3,26,51,.08) 58%,rgba(2,20,40,.34)),url('assets/hero.jpg');background-size:cover;background-position:center center}.content{position:relative;z-index:2;height:100%;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column}.brandbox{text-align:center;margin-top:1.5vh;text-shadow:0 2px 14px #07366577}.brand{font:600 43px Georgia,"Times New Roman",serif;line-height:1}.tag{font-size:9px;letter-spacing:2.7px;font-weight:750;margin-top:8px}.life{font-size:9px;letter-spacing:3.1px;font-weight:800;margin-top:5vh}.message{font-size:13px;letter-spacing:.7px;margin-top:12px}.viewspace{flex:1;min-height:22vh}.actions{display:grid;gap:8px;width:88%;margin:0 auto 2.8vh}.start,.continue,.secondary{border-radius:12px;font-weight:900;box-shadow:0 6px 18px #001a3130}.start{height:60px;border:1px solid #ffffff55;background:#073665ee;color:#fff;font-size:17px}.continue{display:none;height:53px;border:1px solid #fff;background:#fffdf8f2;color:#073665;font-size:14px}.continue.show{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{height:56px;border:1px solid #ffffffdd;background:#fffdf8f2;color:#073665;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:end;font-size:9px;color:#fff;letter-spacing:.5px;text-shadow:0 1px 5px #001a31}.motto{font-size:7px;letter-spacing:1.4px;text-align:right;line-height:1.55}@media(max-height:700px){.life{margin-top:2vh}.viewspace{min-height:12vh}.actions{margin-bottom:1vh}.brand{font-size:38px}}</style></head><body><main class="home"><div class="hero"></div><div class="content"><section class="brandbox"><div class="brand">Arhorngor</div><div class="tag">PLAY · TRACK · IMPROVE</div><div class="life">A BETTER GOLF LIFE</div><div class="message">記錄每一場球，成為更好的自己</div></section><div class="viewspace"></div><section class="actions"><button class="start" id="start">＋ 開始新球局</button><button class="continue" id="continue">▶ 繼續目前球局</button><div class="row"><button class="secondary" id="history">歷史球局</button><button class="secondary" id="bag">我的球袋</button></div></section><footer class="footer"><span>Created by Hwadefa</span><span class="motto">GOOD GOLF<br>A BRIGHTER TOMORROW</span></footer></div></main><script>const active=localStorage.getItem('arhorngor-active-round');if(active)document.getElementById('continue').classList.add('show');document.getElementById('start').onclick=()=>alert('下一步接入：搜尋球場 → 選起始區 → 開始球局');document.getElementById('history').onclick=()=>alert('下一步接入歷史球局');document.getElementById('bag').onclick=()=>alert('下一步接入我的球袋');document.getElementById('continue').onclick=()=>alert('下一步接入目前球局');</script></body></html>
