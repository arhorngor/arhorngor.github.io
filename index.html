<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>Arhorngor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}body{background:#073665}.home{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;color:#fff;background:#178bd2}.sky{position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(2,51,102,.02),rgba(3,24,45,.15)),url('hero.png?v=2');background-size:cover;background-position:center center}.content{position:relative;z-index:2;height:100%;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column}.hot{position:absolute;z-index:5;border:0;background:transparent}.startHot{left:30%;right:5%;top:61%;height:10%}.continueHot{left:30%;right:5%;top:72%;height:9%}.historyHot{left:30%;width:32%;top:82%;height:10%}.bagHot{right:5%;width:32%;top:82%;height:10%}.footer{position:absolute;left:5%;bottom:2.3%;z-index:4;font-size:9px;color:transparent}@media(min-width:521px){.home{box-shadow:0 0 50px #001b3344}}</style></head><body><main class="home"><div class="sky"></div><div class="content"></div><button class="hot startHot" id="start" aria-label="開始新球局"></button><button class="hot continueHot" id="continue" aria-label="繼續目前球局"></button><button class="hot historyHot" id="history" aria-label="歷史球局"></button><button class="hot bagHot" id="bag" aria-label="我的球袋"></button><span class="footer">Created by Hwadefa</span></main><script>document.getElementById('start').onclick=()=>alert('下一步接入：搜尋球場 → 選起始區 → 開始球局');document.getElementById('continue').onclick=()=>alert('下一步接入目前球局');document.getElementById('history').onclick=()=>alert('下一步接入歷史球局');document.getElementById('bag').onclick=()=>alert('下一步接入我的球袋');</script></body></html>
