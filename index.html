<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>Arhorngor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}body{background:#073665}.home{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;color:#fff;background:#178bd2}.sky{position:absolute;inset:0;background-image:linear-gradient(180deg,rgba(2,51,102,.03),rgba(3,24,45,.18)),url('hero.jpg?v=1');background-size:cover;background-position:center center}.hot{position:absolute;z-index:5;border:0;background:transparent}.startHot{left:30%;right:5%;top:61%;height:10%}.continueHot{display:none;left:30%;right:5%;top:72%;height:9%}.continueHot.show{display:block}.historyHot{left:30%;width:32%;top:82%;height:10%}.bagHot{right:5%;width:32%;top:82%;height:10%}@media(min-width:521px){.home{box-shadow:0 0 50px #001b3344}}</style></head><body><main class="home"><div class="sky"></div><button class="hot startHot" id="start" aria-label="開始新球局"></button><button class="hot continueHot" id="continue" aria-label="繼續目前球局"></button><button class="hot historyHot" id="history" aria-label="歷史球局"></button><button class="hot bagHot" id="bag" aria-label="我的球袋"></button></main><script>const active=localStorage.getItem('arhorngor-active-round');if(active)document.getElementById('continue').classList.add('show');document.getElementById('start').onclick=()=>location.href='new-round.html';document.getElementById('continue').onclick=()=>location.href='new-round.html?continue=1';document.getElementById('history').onclick=()=>alert('歷史球局下一階段接入');document.getElementById('bag').onclick=()=>alert('我的球袋下一階段接入');</script></body></html>
