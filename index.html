<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>Arhorngor</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}button{font:inherit}.home{height:100dvh;max-width:520px;margin:auto;position:relative;overflow:hidden;color:#fff;background:#178bd2 url('hero.jpg?v=4') center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,35,65,.22) 0%,rgba(3,35,65,.03) 25%,rgba(3,35,65,0) 64%,rgba(2,20,38,.22) 76%,rgba(2,18,34,.72) 100%)}.content{position:relative;z-index:2;height:100%;padding:calc(env(safe-area-inset-top) + 22px) 18px calc(env(safe-area-inset-bottom) + 17px);display:flex;flex-direction:column}.brand{text-align:center;margin-top:1vh;text-shadow:0 2px 14px #06325e77}.logo{display:flex;justify-content:center;align-items:center}.logo img{display:block;width:min(76vw,330px);height:auto;max-height:118px;object-fit:contain}.tag{font-size:9px;letter-spacing:2.6px;font-weight:800;margin-top:8px}.life,.message{display:none}.space{flex:1;min-height:52vh}.actions{width:88%;margin:0 auto 1.6vh;display:grid;gap:8px}.btn{border-radius:12px;font-weight:900;box-shadow:0 7px 20px #001b3330}.start{height:59px;border:1px solid #ffffff4d;background:rgba(7,54,101,.48);color:#fff;font-size:17px}.continue{display:none;height:52px;border:1px solid #ffffff55;background:rgba(15,35,50,.20);color:#fff;font-size:14px}.continue.show{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.secondary{height:54px;border:1px solid #ffffff4d;background:rgba(15,35,50,.18);color:#fff;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:flex-end;font-size:9px;color:#ffffffd8;text-shadow:0 1px 5px #001b33}.privacy{font-size:8px;opacity:.8}@media(max-height:700px){.brand{margin-top:0}.space{min-height:42vh}.actions{margin-bottom:.7vh}}</style></head><body><main class="home"><div class="shade"></div><div class="content"><section class="brand"><div class="logo"><img src="arhorngor-logo.png?v=1" alt="Arhorngor"></div><div class="tag">PLAY · TRACK · IMPROVE</div></section><div class="space"></div><section class="actions"><button class="btn start" id="start">＋ 開始新球局</button><button class="btn continue" id="continue">▶ 繼續目前球局</button><div class="row"><button class="btn secondary" id="history">歷史球局</button><button class="btn secondary" id="bag">球僮與球袋</button></div></section><footer class="footer"><span>Created by Hwadefa</span><span class="privacy">LOCAL FIRST · NO ACCOUNT</span></footer></div></main><script>const active=localStorage.getItem('arhorngor-active-round');if(active)document.getElementById('continue').classList.add('show');document.getElementById('start').onclick=()=>location.href='new-round.html?v=3';document.getElementById('continue').onclick=()=>location.href='new-round.html?continue=1&v=3';document.getElementById('history').onclick=()=>location.href='history.html?v=1';document.getElementById('bag').onclick=()=>location.href='bag.html?v=3';</script></body></html>
