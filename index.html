<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082f5b">
<title>Arhorngor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}body{background:#082f5b}.hero{min-height:100dvh;position:relative;color:#fff;background-image:linear-gradient(180deg,rgba(5,42,82,.34),rgba(5,42,82,.12) 45%,rgba(4,29,54,.55)),url('https://res.cloudinary.com/luxuryp/images/w_1280,c_limit,f_auto,q_auto/effy38z1gg9gbrunpxuf/pebblebeach_golf_388266324');background-size:cover;background-position:center;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) clamp(18px,6vw,92px) calc(env(safe-area-inset-bottom) + 18px)}.top{display:flex;justify-content:space-between;align-items:flex-start}.wordmark{font:700 clamp(24px,3vw,38px) Georgia,"Times New Roman",serif;letter-spacing:.2px}.tag{font-size:9px;letter-spacing:2.5px;margin-top:5px;opacity:.88}.nav{display:flex;gap:24px;font-size:13px;font-weight:700;align-items:center}.nav button{border:0;background:transparent;color:#fff;font:inherit;cursor:pointer}.center{margin:auto;text-align:center;width:min(760px,100%);padding:10vh 0 4vh}.kicker{font-size:10px;letter-spacing:4px;font-weight:800;margin-bottom:18px;opacity:.88}.brand{font:500 clamp(52px,9vw,108px) Georgia,"Times New Roman",serif;line-height:.9;text-shadow:0 2px 18px rgba(0,0,0,.12)}.slogan{font-size:clamp(12px,1.7vw,19px);letter-spacing:5px;margin-top:24px}.cn{font-size:14px;margin-top:28px;opacity:.9}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(680px,100%);margin:34px auto 0}.btn{height:58px;border:1px solid rgba(255,255,255,.7);border-radius:9px;background:rgba(255,255,255,.91);color:#082f5b;font-weight:850;font-size:15px;backdrop-filter:blur(8px);cursor:pointer}.btn.primary{background:rgba(8,47,91,.93);color:#fff;border-color:rgba(255,255,255,.35)}.bottom{display:flex;justify-content:space-between;align-items:end;font-size:9px;letter-spacing:1.6px;opacity:.8}.author{letter-spacing:.4px}.version{opacity:.7}@media(max-width:650px){.hero{padding-left:16px;padding-right:16px;background-position:58% center}.nav{display:none}.top{justify-content:center;text-align:center}.top .wordmark{display:none}.top .tag{font-size:10px;letter-spacing:2.7px;margin-top:8px}.center{padding-top:2vh}.kicker{margin-bottom:16px}.brand{font-size:56px}.slogan{display:none}.cn{font-size:13px;margin-top:25px}.actions{grid-template-columns:1fr;gap:8px;margin-top:27px}.btn{height:54px}.bottom{margin-top:18px}.version{display:none}}
</style>
</head>
<body>
<main class="hero">
  <header class="top"><div><div class="wordmark">Arhorngor</div><div class="tag">PLAY · TRACK · IMPROVE</div></div><nav class="nav"><button>首頁</button><button id="navScore">記桿</button><button id="navCourse">球場</button><button id="navBag">球袋</button><button id="navHistory">歷史</button></nav></header>
  <section class="center"><div class="kicker">A BETTER GOLF LIFE</div><div class="brand">Arhorngor</div><div class="slogan">PLAY · TRACK · IMPROVE</div><div class="cn">記錄每一場球，看見真正的進步</div><div class="actions"><button class="btn primary" id="start">＋ 開始記桿</button><button class="btn" id="course">瀏覽球場</button><button class="btn" id="history">歷史球局</button></div></section>
  <footer class="bottom"><div class="author">Created by Hwadefa</div><div class="version">ARHORNGOR · FOUNDATION BUILD</div></footer>
</main>
<script>const next={start:'下一步：接入已確認的球場選擇與新球局流程。',course:'下一步：接入台灣球場搜尋與分區。',history:'下一步：接入歷史球局。'};['start','course','history'].forEach(id=>document.getElementById(id).onclick=()=>alert(next[id]));document.getElementById('navScore').onclick=()=>document.getElementById('start').click();document.getElementById('navCourse').onclick=()=>document.getElementById('course').click();document.getElementById('navHistory').onclick=()=>document.getElementById('history').click();document.getElementById('navBag').onclick=()=>alert('下一步：接入我的球袋。');</script>
</body></html>
