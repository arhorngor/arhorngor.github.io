<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>歷史球局 · Arhorngor</title><style>:root{--navy:#073665;--bg:#edf3f7;--line:#dbe5ec;--ink:#173247}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif;background:var(--bg);color:var(--ink)}button{font:inherit}.page{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding:calc(env(safe-area-inset-top) + 15px) 14px calc(env(safe-area-inset-bottom) + 24px)}.head{display:flex;justify-content:space-between;align-items:start}.ey{font-size:9px;letter-spacing:1.5px;color:#7890a1;font-weight:850}.title{font-size:28px;font-weight:900;color:var(--navy);margin:3px 0 18px}.back{border:0;border-radius:9px;background:#eaf4fc;color:var(--navy);padding:9px 11px;font-weight:850}.overall{width:100%;height:58px;border:1px solid #cfe0ea;border-radius:12px;background:#f3f8fb;color:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:900;margin-bottom:16px}.overall small{display:block;color:#8194a0;font-size:9px;margin-top:2px;text-align:left}.round{width:100%;border:0;border-bottom:1px solid #e6edf1;background:#fff;padding:15px 4px;display:grid;grid-template-columns:70px 1fr 58px;align-items:center;text-align:left;color:var(--ink)}.date{font-size:12px;color:#6f8594;font-weight:800}.course{font-size:16px;font-weight:900;color:var(--navy)}.score{text-align:right;font-size:23px;font-weight:950;color:var(--navy)}.empty{text-align:center;color:#8396a2;padding:50px 10px;font-size:12px}</style></head><body><main class="page"><div class="head"><div><div class="ey">ROUND HISTORY</div><div class="title">歷史球局</div></div><button class="back" onclick="location.href='./'">首頁</button></div><button class="overall" id="overall"><span>總分析<small>跨場趨勢與能力分析</small></span><span>›</span></button><div id="list"></div></main><script>const KEY='arhorngor-history',list=JSON.parse(localStorage.getItem(KEY)||'[]'),z=document.getElementById('list');function fmt(x){const d=new Date(x);return String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')}if(!list.length)z.innerHTML='<div class="empty">還沒有完成的歷史球局</div>';else list.sort((a,b)=>new Date(b.finishedAt||b.createdAt)-new Date(a.finishedAt||a.createdAt)).forEach(r=>{const b=document.createElement('button');b.className='round';b.innerHTML='<span class="date">'+fmt(r.finishedAt||r.createdAt)+'</span><span class="course">'+r.course+'</span><span class="score">'+(r.totalScore??'—')+'</span>';b.onclick=()=>{localStorage.setItem('arhorngor-view-round',JSON.stringify(r));location.href='history-round.html?v=1'};z.appendChild(b)});document.getElementById('overall').onclick=()=>location.href='overall-analysis.html?v=1';</script></body></html>
