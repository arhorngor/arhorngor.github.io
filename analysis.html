<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#073665"><title>球局分析 · Arhorngor</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#173247;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang TC",sans-serif}.page{max-width:520px;min-height:100vh;margin:auto;background:#fff;padding:calc(env(safe-area-inset-top) + 14px) 12px 28px}.head{display:flex;justify-content:space-between;align-items:start}.ey{font-size:9px;letter-spacing:1.4px;color:#7890a2;font-weight:900}h1{margin:3px 0 2px;color:#073665;font-size:27px}.sub{font-size:10px;color:#7c8f9b}.back{border:0;border-radius:9px;background:#eaf1f5;color:#31556d;padding:9px 11px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.card,.box{background:#f4f7f9;border-radius:11px;padding:11px}.card{text-align:center}.card b{display:block;font-size:23px;color:#073665}.card span,.small{font-size:9px;color:#7b8e9b}.section{font-size:12px;font-weight:900;color:#073665;margin:17px 0 7px}.bars{display:grid;gap:7px}.bar{display:grid;grid-template-columns:52px 1fr 34px;align-items:center;gap:7px;font-size:10px}.track{height:9px;background:#e5edf2;border-radius:8px;overflow:hidden}.fill{height:100%;background:#176ea8;border-radius:8px}.putts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.putt{text-align:center;background:#f4f7f9;border-radius:10px;padding:10px 4px}.putt b{display:block;font-size:18px;color:#073665}.notice{margin-top:15px;border:1px solid #dce7ee;border-radius:10px;padding:11px;font-size:10px;line-height:1.55;color:#617987}.empty{text-align:center;padding:50px 15px;color:#8194a1}</style></head><body><main class="page" id="app"></main><script>const r=JSON.parse(localStorage.getItem('arhorngor-active-round')||'null'),app=document.getElementById('app');if(!r){app.innerHTML='<div class="empty">這台裝置目前沒有球局資料</div>'}else{let total=0,played=0,putts=0,one=0,two=0,three=0,ok=0;const clubs={},dist={'OK':0,'<3m':0,'3–7m':0,'7m+':0};Object.values(r.holes||{}).forEach(h=>{const s=h.shots||[];if(!s.length)return;played++;total+=s.length;const ps=s.filter(x=>x.club==='PT');putts+=ps.length;if(ps.length===1)one++;else if(ps.length===2)two++;else if(ps.length>=3)three++;s.forEach(x=>{clubs[x.club]=(clubs[x.club]||0)+1;if(x.club==='PT'&&x.putt&&dist[x.putt]!=null)dist[x.putt]++});if(ps.some(x=>x.putt==='OK'))ok++});const clubRows=Object.entries(clubs).filter(([c])=>c!=='PT').sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...clubRows.map(x=>x[1]));const bars=clubRows.map(([c,n])=>`<div class="bar"><b>${c}</b><div class="track"><div class="fill" style="width:${n/max*100}%"></div></div><b>${n}</b></div>`).join('')||'<span class="small">尚無球桿資料</span>';app.innerHTML=`<div class="head"><div><div class="ey">ROUND ANALYSIS</div><h1>${r.course}</h1><div class="sub">依這一場實際已記錄資料分析</div></div><button class="back" onclick="location.href='summary.html?v=2'">總覽</button></div><div class="cards"><div class="card"><b>${total}</b><span>總桿</span></div><div class="card"><b>${putts}</b><span>推桿</span></div><div class="card"><b>${played}</b><span>完成洞</span></div></div><div class="section">推桿結果</div><div class="putts"><div class="putt"><b>${one}</b><span class="small">1推洞</span></div><div class="putt"><b>${two}</b><span class="small">2推洞</span></div><div class="putt"><b>${three}</b><span class="small">3+推洞</span></div><div class="putt"><b>${ok}</b><span class="small">含OK洞</span></div></div><div class="section">第一推距離紀錄</div><div class="putts">${Object.entries(dist).map(([k,v])=>`<div class="putt"><b>${v}</b><span class="small">${k}</span></div>`).join('')}</div><div class="section">球桿使用次數</div><div class="box"><div class="bars">${bars}</div></div><div class="notice"><b>今天這場目前能可靠分析的只有以上資料。</b><br>開球成功率、GIR、100碼內、沙坑救球與五角圖需要記桿頁先記下成功／失敗事件；今天沒有記的資料我不會從球桿順序猜。</div>`}</script></body></html>
